<!DOCTYPE html>
<html>
<head>

<title>Our Story ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#fff0f5;
text-align:center;
padding:20px;
margin:0;
}

.container{
max-width:420px;
margin:auto;
}

h2{
margin-bottom:5px;
}

#days{
margin-bottom:15px;
color:#444;
}

/* chat */

.chatbox{
background:white;
border-radius:20px;
padding:15px;
height:420px;
overflow:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* bubbles */

.message{
padding:10px 15px;
margin:8px;
border-radius:18px;
max-width:70%;
font-size:14px;
}

.you{
background:#0084ff;
color:white;
margin-left:auto;
text-align:right;
}

.her{
background:#f1f1f1;
text-align:left;
}

.system{
background:#ffd6e7;
margin:auto;
text-align:center;
max-width:90%;
}

/* button */

button{
padding:12px 25px;
margin-top:20px;
font-size:16px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

button:hover{
background:#ff1e4d;
}

/* surprise */

#surprise{
display:none;
margin-top:20px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* love letter */

#letter{
display:none;
margin-top:20px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
text-align:left;
min-height:120px;
}

/* hearts */

.heart{
position:fixed;
font-size:20px;
animation:floatUp 4s linear forwards;
}

@keyframes floatUp{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-600px);
opacity:0;
}

}

</style>

</head>

<body>

<div class="container">

<h2>Our Story ❤️</h2>

<div id="days"></div>

<div class="chatbox" id="chat"></div>

<button onclick="showSurprise()">Open Birthday Surprise 🎁</button>

<div id="surprise">

<h2>Happy 26th Birthday 🎂</h2>

<p>

From one Snapchat message  
to someone I can't imagine my life without ❤️

</p>

<button onclick="startLetter()">Read My Letter 💌</button>

</div>

<div id="letter"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* CHAT STORY */

const messages=[

{ text:"25 Sept 2024", type:"system" },

{ text:"Hi 🙂", type:"her" },

{ text:"Hello", type:"you" },

{ text:"Where are you from?", type:"her" },

{ text:"Kerala", type:"you" },

{ text:"Nice to meet you!", type:"her" },

{ text:"That conversation changed everything ❤️", type:"system" },

{ text:"And today is your birthday 🎂", type:"system" }

];

let index=0;

function showMessage(){

if(index>=messages.length) return;

const chat=document.getElementById("chat");

const msg=document.createElement("div");

msg.className="message "+messages[index].type;

msg.innerText=messages[index].text;

chat.appendChild(msg);

chat.scrollTop=chat.scrollHeight;

index++;

setTimeout(showMessage,1500);

}

showMessage();

/* DAYS SINCE MEETING */

const start=new Date("September 25, 2024");
const today=new Date();

const diff=today-start;

const days=Math.floor(diff/(1000*60*60*24));

document.getElementById("days").innerText=
"We have known each other for "+days+" days ❤️";

/* SURPRISE */

function showSurprise(){

document.getElementById("surprise").style.display="block";

confetti({
particleCount:200,
spread:120
});

}

/* LOVE LETTER */

const text = `

From a random Snapchat message on September 25, 2024,
you slowly became the most important person in my life.

I never expected that one small conversation
would turn into something so meaningful.

Even though we haven't met in person yet,
you still managed to make my days brighter.

Your smile, your words, your presence in my life
mean more to me than you know.

Today is your special day,
and I just want to remind you how amazing you are.

Happy 26th Birthday ❤️

`;

let i = 0;

function startLetter(){

document.getElementById("letter").style.display="block";

typeLetter();

}

function typeLetter(){

if(i < text.length){

document.getElementById("letter").innerHTML += text.charAt(i);

i++;

setTimeout(typeLetter,40);

}

}

/* FLOATING HEARTS */

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},4000);

}

setInterval(createHeart,600);

</script>

</body>
</html>
